global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: studio
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: local-llm-studio

  # Prometheus's own metrics — useful for meta-monitoring the scraper.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
