[project]
name = "local-llm-studio"
version = "0.1.0"
description = "Local FastAPI + SPA workspace for on-device Ollama models (Apple M4 Pro edition)"
requires-python = ">=3.12,<3.14"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
    "pydantic>=2.5",
    "httpx>=0.27",
    "tiktoken>=0.8",
    "ddgs>=6.3",
    "numpy>=1.26",
    "yoyo-migrations>=8.2",
    "pypdf>=5.0",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.32",
    "ruff>=0.6",
    "mypy>=1.11",
    "reportlab>=4.0",  # tests only — build PDF fixtures on the fly
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --cov=backend --cov-report=term-missing --cov-report=html --ignore=tests/e2e"
asyncio_mode = "auto"
markers = [
    "integration: talks to a real Ollama or filesystem",
    "e2e: end-to-end browser test (playwright)",
    "slow: takes more than a couple of seconds",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/__pycache__/*",
    "backend/migrations.py",
    "backend/legacy/*",
    # TypedDict declarations — no runtime code to exercise.
    "backend/types.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
files = ["backend", "desktop"]
exclude = [
    "^backend/artifacts/",       # runtime-generated artifact files
    "^backend/uploads/",         # runtime-generated uploads
    "^backend/__pycache__/",
]
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = false     # tighten to true once every function has annotations
disallow_incomplete_defs = false  # tighten later once low-hanging fruit fixed
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["backend.legacy.*", "tests.*", "yoyo.*"]
ignore_errors = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"tests/backend/legacy/*" = ["E402", "F401", "F841"]
# FastAPI's `= File(...)` / `= Form(...)` / `= Depends(...)` pattern is idiomatic;
# B008 is a false positive here.
"backend/server.py" = ["B008"]
