name: Release macOS .app

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only — skip sign/notarize/upload'
        type: boolean
        default: false

# One release build per tag at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-14   # Apple Silicon runner
    timeout-minutes: 45
    permissions:
      contents: write    # needed to attach assets to the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install runtime + packaging deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r desktop/requirements.txt

      # ── Build ────────────────────────────────────────────────────────
      - name: Build .app bundle
        run: python desktop/build_app.py

      # ── Optional: sign + notarize + staple ───────────────────────────
      # Skipped entirely if the required secrets aren't set — the workflow
      # still uploads an unsigned artifact so a maintainer can inspect the
      # bundle. Configure repo secrets: APPLE_DEV_ID_CERT_P12 (base64),
      # APPLE_DEV_ID_CERT_PASSWORD, APPLE_DEV_ID_IDENTITY, APPLE_ID,
      # APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD.
      - name: Import signing certificate
        if: ${{ !inputs.dry_run && secrets.APPLE_DEV_ID_CERT_P12 != '' }}
        env:
          CERT_P12: ${{ secrets.APPLE_DEV_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEV_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Codesign .app
        if: ${{ !inputs.dry_run && secrets.APPLE_DEV_ID_IDENTITY != '' }}
        env:
          APPLE_DEV_ID: ${{ secrets.APPLE_DEV_ID_IDENTITY }}
        run: make sign

      - name: Notarize + staple
        if: ${{ !inputs.dry_run && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: make notarize

      # ── Package + upload ─────────────────────────────────────────────
      - name: Zip .app for release upload
        run: ditto -c -k --keepParent dist/LocalLLMStudio.app dist/LocalLLMStudio-${{ github.ref_name }}.app.zip

      - name: Upload artifact (dry-run or fallback)
        uses: actions/upload-artifact@v4
        with:
          name: LocalLLMStudio-${{ github.ref_name }}
          path: dist/LocalLLMStudio-*.app.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LocalLLMStudio-*.app.zip
          fail_on_unmatched_files: true
